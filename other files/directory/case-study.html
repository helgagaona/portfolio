<!DOCTYPE html>
<html lang="en">

<body data-page-type="case-study">
  <header class="site-header">
    <a class="logo" href="index.html">HG<span>.</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a class="header-button" href="mailto:helgaarellanogaona@gmail.com">Let's talk <span>↗</span></a>
  </header>
  <main id="project-page" class="project-page" aria-busy="true">
    <p id="project-error" class="project-error section-container" role="alert" hidden></p>
    <section class="case-hero section-container">
      <a class="back-link" href="index.html#work">← Back to selected work</a>
      <p class="eyebrow" id="project-category"></p>
      <h1 id="project-title"></h1>
      <p class="case-summary" id="project-summary"></p>
      <figure class="case-hero-visual" id="project-visual"></figure>
    </section>
    <section class="case-overview section-container" id="case-overview">
      <div class="overview-details" id="project-details">
        <div data-detail="role"><span>My role</span><strong id="project-role"></strong></div>
        <div data-detail="tools"><span>Tools</span><strong id="project-tools"></strong></div>
        <div data-detail="timeline"><span>Timeline</span><strong id="project-timeline"></strong></div>
      </div>
      <div class="overview-copy">
        <p class="eyebrow">Overview</p>
        <h2 id="project-overview-title"></h2>
        <p id="project-overview"></p>
      </div>
    </section>
    <section class="case-process" id="case-process" hidden>
      <div class="section-container">
        <p class="eyebrow">The process</p>
        <h2>From a challenge<br><em>to a clearer experience.</em></h2>
        <div class="process-grid" id="process-grid"></div>
      </div>
    </section>
    <section class="case-reflection section-container" id="case-reflection" hidden>
      <div><p class="eyebrow">What I learned</p><h2 id="project-learning-title"></h2></div>
      <p id="project-learning"></p>
    </section>
    <section class="next-project section-container" id="next-project" hidden>
      <a id="next-project-link" href="#">
        <span>Next project</span><strong id="next-project-title"></strong><b>↗</b>
      </a>
    </section>
  </main>ß
  <footer class="footer section-container">
    <span>© 2026 Helga Gaona</span>
    <div><a href="index.html#work">All work</a><a href="mailto:helgaarellanogaona@gmail.com">Email ↗</a></div>
